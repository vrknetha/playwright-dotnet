parameters:
  - name: environment
    type: string
  - name: testResultsPath
    type: string
  - name: tracePath
    type: string
  - name: status
    type: string
  - name: testTags
    type: string
  - name: reportBaseUrl
    type: string

steps:
  - task: PowerShell@2
    displayName: 'Process Test Results and Traces'
    condition: always()
    inputs:
      targetType: 'inline'
      script: |
        # Get test results summary
        $trxFiles = Get-ChildItem -Path "${{ parameters.testResultsPath }}" -Filter "*.trx" -Recurse
        $totalTests = 0
        $passedTests = 0
        $failedTests = 0
        $failedTestDetails = @()
        
        foreach ($file in $trxFiles) {
            $xml = [xml](Get-Content $file.FullName)
            $counters = $xml.TestRun.ResultSummary.Counters
            $totalTests += [int]$counters.total
            $passedTests += [int]$counters.passed
            $failedTests += [int]$counters.failed
            
            # Collect failed test details
            $failedResults = $xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq "Failed" }
            foreach ($result in $failedResults) {
                $failedTestDetails += @{
                    name = $result.testName
                    message = $result.Output.ErrorInfo.Message
                }
            }
        }
        
        # Get report links
        $reportLinks = @{
            testResults = "${{ parameters.reportBaseUrl }}/test-results"
            playwrightReport = "${{ parameters.reportBaseUrl }}/playwright-report/index.html"
            traces = "${{ parameters.reportBaseUrl }}/traces"
        }
        
        # Set variables for use in notification
        Write-Host "##vso[task.setvariable variable=TestTotal]$totalTests"
        Write-Host "##vso[task.setvariable variable=TestPassed]$passedTests"
        Write-Host "##vso[task.setvariable variable=TestFailed]$failedTests"
        Write-Host "##vso[task.setvariable variable=FailedTestsJson]$(ConvertTo-Json $failedTestDetails -Compress)"
        Write-Host "##vso[task.setvariable variable=ReportLinksJson]$(ConvertTo-Json $reportLinks -Compress)"

  - template: notification-providers/teams.yml
    parameters:
      environment: ${{ parameters.environment }}
      status: ${{ parameters.status }}
      totalTests: $(TestTotal)
      passedTests: $(TestPassed)
      failedTests: $(TestFailed)
      testTags: ${{ parameters.testTags }}
      failedTestsJson: $(FailedTestsJson)
      reportLinksJson: $(ReportLinksJson)

  - template: notification-providers/email.yml
    parameters:
      environment: ${{ parameters.environment }}
      status: ${{ parameters.status }}
      totalTests: $(TestTotal)
      passedTests: $(TestPassed)
      failedTests: $(TestFailed)
      testTags: ${{ parameters.testTags }}
      failedTestsJson: $(FailedTestsJson)
      reportLinksJson: $(ReportLinksJson) 