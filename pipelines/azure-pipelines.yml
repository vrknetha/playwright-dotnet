parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: Development
    values:
      - Development
      - QA
      - Staging
      - Production
  - name: testTags
    displayName: 'Test Tags (e.g. smoke, smoke|api, cat==smoke||cat==api)'
    type: string
    default: ''  # Empty means run all tests
  - name: numberOfWorkers
    displayName: 'Number of Parallel Test Workers'
    type: number
    default: 2
    values:
      - 1
      - 2
      - 4
      - 6
      - 8
      - 10
  - name: targetBranch
    displayName: 'Source Branch'
    type: string
    values:
      - refs/heads/main
      - refs/heads/develop
      - refs/heads/feature/*
      - refs/heads/release/*
      - refs/heads/hotfix/*
    default: refs/heads/develop

trigger:
  batch: true
  branches:
    include:
      - main
      - develop
      - feature/*
      - release/*
    exclude:
      - docs/*
  paths:
    include:
      - '**'
    exclude:
      - '**/*.md'
      - 'docs/*'
      - '.gitignore'

pr:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - '**'
    exclude:
      - '**/*.md'
      - 'docs/*'
      - '.gitignore'

pool:
  vmImage: 'windows-latest'

variables:
  - name: DOTNET_ENVIRONMENT
    value: ${{ parameters.environment }}
  - group: test-credentials-${{ parameters.environment }}
  - name: testResultsDirectory
    value: '$(Build.SourcesDirectory)/TestResults'
  - name: buildConfiguration
    value: 'Release'
  - name: traceDirectory
    value: '$(Build.SourcesDirectory)/playwright-traces'
  - name: reportBaseUrl
    value: '$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)'
  - group: storage-credentials  # Contains: StorageAccount, StorageKey, StorageContainer
  - name: blobBaseUrl
    value: 'https://$(StorageAccount).blob.core.windows.net/$(StorageContainer)'

steps:
  - task: UseDotNet@2
    displayName: 'Setup .NET'
    inputs:
      version: '8.x'
      
  - task: DotNetCoreCLI@2
    displayName: 'Restore NuGet packages'
    inputs:
      command: 'restore'
      projects: '**/*.csproj'

  - task: DotNetCoreCLI@2
    displayName: 'Run Tests'
    inputs:
      command: 'test'
      projects: '**/*Tests.csproj'
      arguments: >-
        --configuration $(buildConfiguration)
        --environment ${{ parameters.environment }}
        --logger trx
        --results-directory "$(testResultsDirectory)"
        ${{ if ne(parameters.testTags, '') }}--filter "${{ parameters.testTags }}"
        -- NUnit.NumberOfTestWorkers=${{ parameters.numberOfWorkers }}
        TestSettings:Auth:CommonPassword=$(CommonPassword)
        TestSettings:Trace:Directory=$(traceDirectory)
        TestSettings:Trace:Enabled=true
    continueOnError: true

  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(testResultsDirectory)/**/*.trx'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: '${{ parameters.environment }} - ${{ parameters.testTags }} Tests'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Test Artifacts'
    condition: always()
    inputs:
      PathtoPublish: '$(testResultsDirectory)'
      ArtifactName: '${{ parameters.environment }}-${{ parameters.testTags }}-test-results'
      publishLocation: 'Container'

  # Publish Playwright Report
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Playwright Report'
    condition: always()
    inputs:
      PathtoPublish: '$(testResultsDirectory)/playwright-report'
      ArtifactName: '${{ parameters.environment }}-${{ parameters.testTags }}-playwright-report'
      publishLocation: 'Container'

  # Publish Playwright Traces with special metadata
  - task: PowerShell@2
    displayName: 'Process Trace Files'
    condition: always()
    inputs:
      targetType: 'inline'
      script: |
        $traceFiles = Get-ChildItem -Path "$(traceDirectory)" -Filter "*.zip" -Recurse
        foreach ($trace in $traceFiles) {
            $traceUrl = "$(reportBaseUrl)&artifactName=${{ parameters.environment }}-traces&fileId=$($trace.Name)"
            $viewerUrl = "https://trace.playwright.dev/?trace=$traceUrl"
            
            # Add to trace metadata file
            @{
                traceFile = $trace.Name
                viewUrl = $viewerUrl
                environment = "${{ parameters.environment }}"
                testTags = "${{ parameters.testTags }}"
                timestamp = (Get-Date).ToString("o")
            } | ConvertTo-Json | Out-File -FilePath "$($trace.DirectoryName)/$($trace.BaseName).meta.json"
        }

  # Publish Traces
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Playwright Traces'
    condition: always()
    inputs:
      PathtoPublish: '$(traceDirectory)'
      ArtifactName: '${{ parameters.environment }}-traces'
      publishLocation: 'Container'

  # Upload reports and traces to Blob Storage
  - task: AzurePowerShell@5
    displayName: 'Upload Reports to Blob Storage'
    condition: always()
    inputs:
      azureSubscription: 'Your-Azure-Connection'
      ScriptType: 'InlineScript'
      Inline: |
        # Get storage context
        $storageContext = New-AzStorageContext -StorageAccountName "$(StorageAccount)" -StorageAccountKey "$(StorageKey)"
        
        # Create folder structure: reports/YYYY-MM-DD/buildId/
        $dateFolder = Get-Date -Format "yyyy-MM-dd"
        $buildFolder = "$(Build.BuildId)"
        $blobPrefix = "reports/$dateFolder/$buildFolder"
        
        # Upload test results
        Get-ChildItem -Path "$(testResultsDirectory)" -Recurse -File | ForEach-Object {
            $blobName = "$blobPrefix/test-results/$($_.Name)"
            Set-AzStorageBlobContent -Context $storageContext -Container "$(StorageContainer)" -File $_.FullName -Blob $blobName -Force
        }
        
        # Upload Playwright report
        Get-ChildItem -Path "$(testResultsDirectory)/playwright-report" -Recurse -File | ForEach-Object {
            $blobName = "$blobPrefix/playwright-report/$($_.Name)"
            Set-AzStorageBlobContent -Context $storageContext -Container "$(StorageContainer)" -File $_.FullName -Blob $blobName -Force
        }
        
        # Upload traces with metadata
        Get-ChildItem -Path "$(traceDirectory)" -Recurse -File | ForEach-Object {
            $blobName = "$blobPrefix/traces/$($_.Name)"
            $blobUrl = "$(blobBaseUrl)/$blobName"
            
            # Upload trace file
            Set-AzStorageBlobContent -Context $storageContext -Container "$(StorageContainer)" -File $_.FullName -Blob $blobName -Force
            
            if ($_.Extension -eq ".zip") {
                # Create viewer URL for trace files
                $viewerUrl = "https://trace.playwright.dev/?trace=$blobUrl"
                
                # Update metadata file
                $metaFile = "$($_.DirectoryName)/$($_.BaseName).meta.json"
                $metadata = @{
                    traceFile = $_.Name
                    blobUrl = $blobUrl
                    viewerUrl = $viewerUrl
                    environment = "${{ parameters.environment }}"
                    testTags = "${{ parameters.testTags }}"
                    timestamp = (Get-Date).ToString("o")
                    buildId = "$(Build.BuildId)"
                    buildNumber = "$(Build.BuildNumber)"
                }
                $metadata | ConvertTo-Json | Out-File -FilePath $metaFile
                
                # Upload metadata file
                $metaBlobName = "$blobPrefix/traces/$($_.BaseName).meta.json"
                Set-AzStorageBlobContent -Context $storageContext -Container "$(StorageContainer)" -File $metaFile -Blob $metaBlobName -Force
            }
        }
        
        # Generate index file with links
        $index = @{
            buildId = "$(Build.BuildId)"
            buildNumber = "$(Build.BuildNumber)"
            environment = "${{ parameters.environment }}"
            testTags = "${{ parameters.testTags }}"
            timestamp = (Get-Date).ToString("o")
            links = @{
                testResults = "$(blobBaseUrl)/$blobPrefix/test-results"
                playwrightReport = "$(blobBaseUrl)/$blobPrefix/playwright-report/index.html"
                traces = "$(blobBaseUrl)/$blobPrefix/traces"
            }
        }
        $index | ConvertTo-Json | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/report-index.json"
        Set-AzStorageBlobContent -Context $storageContext -Container "$(StorageContainer)" -File "$(Build.ArtifactStagingDirectory)/report-index.json" -Blob "$blobPrefix/index.json" -Force
      pwsh: true
      azurePowerShellVersion: 'LatestVersion'

  # Update notification template parameters
  - template: templates/notifications.yml
    parameters:
      environment: ${{ parameters.environment }}
      testResultsPath: '$(testResultsDirectory)'
      tracePath: '$(traceDirectory)'
      status: '$(Agent.JobStatus)'
      testTags: ${{ parameters.testTags }}
      reportBaseUrl: '$(blobBaseUrl)/reports/$(Get-Date -Format "yyyy-MM-dd")/$(Build.BuildId)' 

resources:
  repositories:
    - repository: self
      ref: ${{ parameters.targetBranch }}

steps:
  - checkout: self
    clean: true 

stages:
- stage: AuthSetup
  jobs:
  - job: GenerateAuth
    steps:
    - task: Bash@3
      displayName: '🔐 Generate Auth States'
      inputs:
        targetType: 'inline'
        script: |
          dotnet run --project src/AuthSetup
          # Upload .auth folder as pipeline artifact
          mkdir -p artifacts/auth
          cp -r .auth/* artifacts/auth/
          echo "##vso[artifact.upload containername=auth;artifactname=auth]$(System.DefaultWorkingDirectory)/artifacts/auth"

- stage: RunTests
  dependsOn: AuthSetup
  jobs:
  - job: ExecuteTests
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifactName: 'auth'
        targetPath: '$(System.DefaultWorkingDirectory)/.auth'
        
    - task: Bash@3
      displayName: '🚀 Run Tests'
      inputs:
        targetType: 'inline'
        script: 'dotnet test'

- stage: AuthSetup
  variables:
    ASPNETCORE_ENVIRONMENT: QA
    Auth__CommonPassword: $(QA_PASSWORD) # From pipeline secrets 