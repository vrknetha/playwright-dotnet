# ... previous stages remain the same ...

parameters:
  - name: performMetricsCleanup
    type: boolean
    default: false
    displayName: 'Perform Metrics Cleanup'
  - name: workerCount
    type: number
    default: 4
    displayName: 'Number of Parallel Workers'
  - name: browser
    type: string
    default: ''  # Empty means use appsettings.json configuration
    displayName: 'Browser to run tests (leave empty to use appsettings.json)'
    values:
      - ''        # Use appsettings.json
      - chromium
      - firefox
      - webkit
  - name: testFilter
    type: string
    default: ''
    displayName: 'Test Filter Expression'
    # NUnit Filter Examples:
    # TestCategory=Smoke                 -> Run smoke tests
    # TestCategory=UI                    -> Run UI tests
    # TestCategory=Smoke|TestCategory=UI -> Run smoke OR UI tests
    # Name~Login                         -> Run tests with "Login" in name
    # FullyQualifiedName~LoginTests      -> Run specific test class
    # Priority=High                      -> Run high priority tests
    # TestCategory=UI&Priority=High      -> Run high priority UI tests
    #
    # Playwright Filter Examples:
    # TestCategory=Browser               -> Run browser tests
    # TestCategory=API                   -> Run API tests
    # TestCategory=Authentication        -> Run auth tests
    # Browser=chromium                   -> Run tests for specific browser
    # Project=LoginFeature              -> Run tests for specific feature
  - name: headless
    type: boolean
    default: true
    displayName: 'Run tests in headless mode'

variables:
  METRICS_ARTIFACT_NAME: 'test-metrics-history'
  METRICS_LOCK_TIMEOUT: '300' # 5 minutes in seconds
  ${{ if ne(parameters.browser, '') }}:
    BROWSER: ${{ parameters.browser }}  # Override only if specified
  HEADED: ${{ if eq(parameters.headless, false) }}1${{ else }}0${{ end }}

jobs:
- job: MetricsCleanup
  condition: eq('${{ parameters.performMetricsCleanup }}', true)
  displayName: 'Cleanup Test Metrics'
  steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download Metrics History'
    inputs:
      source: 'specific'
      project: '$(System.TeamProject)'
      pipeline: '$(System.DefinitionId)'
      runVersion: 'latest'
      artifact: '$(METRICS_ARTIFACT_NAME)'
      path: '$(Build.SourcesDirectory)/TestResults'
    continueOnError: true

  - task: DotNetCoreCLI@2
    displayName: 'Run Metrics Cleanup'
    inputs:
      command: 'test'
      projects: '**/*.csproj'
      arguments: '--filter "TestCategory=MetricsCleanup"'
      testRunTitle: 'Metrics Cleanup'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Updated Metrics'
    inputs:
      targetPath: '$(Build.SourcesDirectory)/TestResults/metrics_history.json'
      artifact: '$(METRICS_ARTIFACT_NAME)'
    condition: succeededOrFailed()

- job: RunTests
  dependsOn: MetricsCleanup
  condition: in(dependencies.MetricsCleanup.result, 'Succeeded', 'Skipped')
  timeoutInMinutes: 60 # Prevent hanging jobs
  steps:
  # Install Playwright browsers
  - script: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps
    displayName: 'Install Playwright browsers'

  # Run tests
  - task: DotNetCoreCLI@2
    displayName: 'Run Tests'
    inputs:
      command: 'test'
      projects: '**/*.csproj'
      arguments: >-
        --logger trx 
        --results-directory "$(Build.SourcesDirectory)/TestResults" 
        ${{ if ne(parameters.testFilter, '') }}--filter "${{ parameters.testFilter }}"${{ end }}
        -- NUnit.NumberOfTestWorkers=${{ parameters.workerCount }}
        ${{ if ne(parameters.browser, '') }}Playwright.BrowserName=$(BROWSER)${{ end }}
    retryCountOnTaskFailure: 2
    env:
      ${{ if ne(parameters.browser, '') }}:
        BROWSER: $(BROWSER)
      HEADED: $(HEADED)

  # Publish test results
  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Build.SourcesDirectory)/TestResults'
    condition: succeededOrFailed()

- stage: Notifications
  displayName: 'Send Notifications'
  dependsOn: RunTests
  condition: always()
  jobs:
  - job: SendNotifications
    displayName: 'Send Test Results Notifications'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: templates/notifications.yml
      parameters:
        testResultsPath: '$(System.DefaultWorkingDirectory)/TestResults' 